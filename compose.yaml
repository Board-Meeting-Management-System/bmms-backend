services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bmms_local
      POSTGRES_PASSWORD: bmms_local_dev
      POSTGRES_DB: bmms_control
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bmms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmms_local -d bmms_control"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  bmms_pgdata:
